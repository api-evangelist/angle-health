aid: angle-health
name: Angle Health
description: >-
  Angle Health is a San Francisco-based, AI-native health insurance company
  offering full-stack, level-funded group health plans for small and mid-sized
  employers. Its platform pairs rapid, firm, bindable quoting with a modern
  benefits-administration experience that integrates with 100+ payroll and HRIS
  systems, a member care team, iOS/Android mobile apps, and pharmacy benefits
  (AngleRx). Angle also runs a partner API platform that lets quoting platforms,
  broker technology providers, and MGAs generate fully underwritten, firm,
  bindable level-funded quotes in minutes, along with automated proposal
  generation and member health scorecards with risk and cost-driver analysis.
  Developer documentation lives in an access-on-request partner portal.
